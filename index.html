<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CYP Staffing - International Representatives</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#1a1f5e;--navy-mid:#2d3494;--navy-light:#eef0fc;--navy-border:#c5c9f0;--green-dot:#5DE0A5;--bg:#f4f5f9;--surface:#ffffff;--text:#1a1a2e;--text-muted:#6b7280;--border:rgba(0,0,0,0.1)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.page-wrap{width:100%;max-width:680px}
.shell{display:flex;flex-direction:column;height:780px;border-radius:20px;overflow:hidden;border:0.5px solid var(--border);background:var(--surface);box-shadow:0 8px 40px rgba(26,31,94,0.12)}
@media(max-width:600px){
  body{padding:0;background:var(--surface);justify-content:flex-start}
  .page-wrap{max-width:100%;height:100vh;height:100dvh}
  .shell{height:100%;height:100dvh;border-radius:0;border:none;box-shadow:none}
  .bubble{max-width:88%;font-size:15px}
  .chip{padding:8px 16px;font-size:13px}
  .header-inner{padding:12px 14px;gap:10px}
  .header-logo{height:36px}
  .header-title{font-size:12px}
  .header-badge{display:none}
  .input-bar{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .chips-area{padding:8px 12px 10px}
  .input-bar input{font-size:16px}
  .terms-card,.upload-card{max-width:95%}
}
.header{background:linear-gradient(135deg,#1a1f5e 0%,#2d3494 100%);flex-shrink:0;position:relative;overflow:hidden}
.header-bg-chakra{position:absolute;right:-30px;top:-30px;width:140px;height:140px;opacity:0.06}
.header-inner{padding:16px 20px;display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.header-logo{height:44px;width:auto;flex-shrink:0;filter:brightness(0) invert(1)}
.header-divider{width:1px;height:40px;background:rgba(255,255,255,0.25);flex-shrink:0}
.header-text{flex:1}
.header-eyebrow{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.6);margin-bottom:3px}
.header-title{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.header-badge{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,0.12);border:0.5px solid rgba(255,255,255,0.2);border-radius:20px;padding:5px 10px;flex-shrink:0}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--green-dot);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.badge-text{font-size:11px;color:rgba(255,255,255,0.85)}
.progress-strip{background:rgba(0,0,0,0.22);padding:8px 20px;display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.progress-steps{display:flex;gap:4px;flex:1}
.step-pip{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,0.15);transition:background 0.4s}
.step-pip.done{background:var(--green-dot)}
.step-pip.active{background:rgba(255,255,255,0.5)}
.progress-txt{font-size:11px;color:rgba(255,255,255,0.6);white-space:nowrap;flex-shrink:0}
.chat-area{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;background:#f6f7fb}
.chat-area::-webkit-scrollbar{width:4px}
.chat-area::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:2px}
.bubble-row{display:flex;align-items:flex-end;gap:8px}
.bubble-row.user{justify-content:flex-end}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bubble{max-width:80%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.6}
.bubble.bot{background:var(--surface);color:var(--text);border-bottom-left-radius:4px;border:0.5px solid rgba(0,0,0,0.08);box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.bubble.user{background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.bubble.error{background:#fff0f0;border:0.5px solid #fcc;color:#a32d2d;font-size:13px}
.typing-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:#aaa;margin:0 1.5px;animation:blink 1.2s infinite}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,80%,100%{opacity:0.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.file-bubble{display:flex;align-items:center;gap:10px;background:var(--surface);border:0.5px solid rgba(0,0,0,0.1);border-radius:12px;padding:10px 14px;max-width:260px}
.file-icon{width:32px;height:32px;border-radius:8px;background:var(--navy-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.file-info{flex:1;min-width:0}
.file-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-size:11px;color:var(--text-muted);margin-top:1px}
.terms-card{background:var(--surface);border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;overflow:hidden;max-width:88%;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.terms-header{background:var(--navy-light);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--navy-border)}
.terms-icon{width:22px;height:22px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.terms-header-title{font-size:12px;font-weight:600;color:var(--navy)}
.terms-body{padding:12px 14px}
.terms-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.terms-item:last-child{margin-bottom:0}
.terms-bullet{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.terms-bullet.remote{background:#e0f2fe}
.terms-bullet.unpaid{background:#fff3e0}
.terms-bullet.time{background:#fce4ec}
.terms-bullet.connect{background:var(--navy-light)}
.terms-bullet.cert{background:#e8f5ee}
.terms-item-text{font-size:12px;line-height:1.55;color:var(--text)}
.terms-item-text b{font-weight:600;color:var(--navy)}
.terms-disclaimer{margin-top:10px;padding-top:10px;border-top:0.5px solid rgba(0,0,0,0.08);font-size:11px;color:var(--text-muted);line-height:1.5}
.terms-agree-btn{display:block;width:100%;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;margin-top:12px;font-family:inherit;transition:opacity 0.15s}
.terms-agree-btn:hover{opacity:0.88}
.terms-agree-btn:disabled{opacity:0.4;cursor:not-allowed}
.upload-card{background:var(--surface);border:0.5px solid rgba(0,0,0,0.1);border-radius:14px;overflow:hidden;max-width:86%;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.upload-header{background:var(--navy-light);padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--navy-border)}
.upload-header-title{font-size:12px;font-weight:600;color:var(--navy)}
.upload-body{padding:12px 14px}
.upload-desc{font-size:13px;color:var(--text);line-height:1.55;margin-bottom:12px}
.drop-zone{border:1.5px dashed var(--navy-border);border-radius:10px;padding:24px;text-align:center;cursor:pointer;transition:background 0.15s}
.drop-zone:hover{background:var(--navy-light)}
.drop-zone.drag-over{background:var(--navy-light);border-color:var(--navy-mid)}
.drop-text{font-size:13px;color:var(--text-muted);line-height:1.5;margin-top:8px}
.drop-text b{color:var(--navy);font-weight:600}
.drop-types{font-size:11px;color:var(--text-muted);margin-top:4px}
.chips-area{padding:10px 16px;background:#f6f7fb;flex-shrink:0;border-top:0.5px solid rgba(0,0,0,0.06)}
.chips-label{font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase}
.chips-sublabel{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--navy);color:#fff;border:none;border-radius:20px;padding:7px 15px;font-size:12px;cursor:pointer;transition:opacity 0.15s;font-family:inherit;user-select:none;opacity:0.38}
.chip:hover{opacity:0.65}
.chip.selected{opacity:1}
.chips-action{margin-top:10px;display:flex;gap:8px;align-items:center}
.chips-confirm{background:var(--navy);color:#fff;border:none;border-radius:20px;padding:8px 18px;font-size:12px;cursor:pointer;font-family:inherit;transition:opacity 0.15s}
.chips-confirm:hover{opacity:0.85}
.chips-confirm:disabled{opacity:0.32;cursor:not-allowed}
.chips-clear{background:transparent;color:var(--text-muted);border:0.5px solid rgba(0,0,0,0.15);border-radius:20px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit}
.chips-count{font-size:11px;color:var(--text-muted);margin-left:4px}
.input-bar{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:12px 16px;border-top:0.5px solid rgba(0,0,0,0.08);background:var(--surface)}
.attach-btn{width:38px;height:38px;border-radius:50%;background:transparent;border:0.5px solid rgba(0,0,0,0.15);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.15s}
.attach-btn:hover{background:#f0f0f0}
.attach-btn:disabled{opacity:0.3;cursor:not-allowed}
.input-bar input{flex:1;border:0.5px solid rgba(0,0,0,0.15);border-radius:24px;padding:10px 16px;font-size:14px;background:#f6f7fb;color:var(--text);font-family:inherit;outline:none;transition:border 0.15s,background 0.15s}
.input-bar input:focus{border-color:var(--navy-mid);background:#fff}
.input-bar input:disabled{opacity:0.45;cursor:not-allowed}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--navy);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:opacity 0.15s}
.send-btn:hover{opacity:0.85}
.send-btn:disabled{opacity:0.3;cursor:not-allowed}
.send-btn svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2.2}
.complete-card{margin:0 16px 12px;background:var(--navy-light);border:0.5px solid var(--navy-border);border-radius:12px;padding:14px 16px;display:none;flex-direction:column;gap:6px}
.complete-title{font-size:13px;font-weight:600;color:var(--navy)}
.complete-sub{font-size:12px;color:var(--navy-mid);line-height:1.55}
.submitting-bar{display:none;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);padding:8px 16px;background:var(--surface);border-top:0.5px solid rgba(0,0,0,0.06);flex-shrink:0}
.spin{width:14px;height:14px;border:2px solid rgba(26,31,94,0.15);border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="page-wrap"><div class="shell">
<div class="header">
  <svg class="header-bg-chakra" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="95" fill="none" stroke="white" stroke-width="6"/>
    <circle cx="100" cy="100" r="18" fill="none" stroke="white" stroke-width="5"/>
    <line x1="100" y1="18" x2="100" y2="82" stroke="white" stroke-width="3"/>
    <line x1="145" y1="28" x2="117" y2="85" stroke="white" stroke-width="3"/>
    <line x1="178" y1="60" x2="130" y2="110" stroke="white" stroke-width="3"/>
    <line x1="185" y1="105" x2="121" y2="108" stroke="white" stroke-width="3"/>
    <line x1="165" y1="148" x2="115" y2="120" stroke="white" stroke-width="3"/>
    <line x1="128" y1="182" x2="105" y2="130" stroke="white" stroke-width="3"/>
    <line x1="82" y1="185" x2="95" y2="130" stroke="white" stroke-width="3"/>
    <line x1="42" y1="165" x2="87" y2="120" stroke="white" stroke-width="3"/>
    <line x1="16" y1="128" x2="82" y2="108" stroke="white" stroke-width="3"/>
    <line x1="18" y1="78" x2="82" y2="92" stroke="white" stroke-width="3"/>
    <line x1="42" y1="40" x2="88" y2="88" stroke="white" stroke-width="3"/>
    <line x1="82" y1="18" x2="95" y2="82" stroke="white" stroke-width="3"/>
  </svg>
  <div class="header-inner">
    <img src="cyp-logo.png" class="header-logo" alt="Centre for Youth Policy"/>
    <div class="header-divider"></div>
    <div class="header-text">
      <div class="header-eyebrow">Centre for Youth Policy</div>
      <div class="header-title">Staffing for International Representatives</div>
    </div>
    <div class="header-badge"><div class="badge-dot"></div><div class="badge-text">AI Assistant</div></div>
  </div>
  <div class="progress-strip">
    <div class="progress-steps" id="stepPips"></div>
    <div class="progress-txt" id="progressTxt">Getting started</div>
  </div>
</div>
<div class="chat-area" id="chatArea"></div>
<div class="complete-card" id="completeCard">
  <div class="complete-title">Application submitted</div>
  <div class="complete-sub">The CYP team will be in touch within 5 business days.</div>
</div>
<div class="submitting-bar" id="submittingBar"><div class="spin"></div><span>Submitting your application...</span></div>
<div class="chips-area" id="chipsArea" style="display:none;">
  <div class="chips-label" id="chipsLabel">Select all that apply</div>
  <div class="chips-sublabel" id="chipsSublabel" style="display:none;"></div>
  <div class="chips" id="chipsContainer"></div>
  <div class="chips-action" id="chipsAction" style="display:none;">
    <button class="chips-confirm" id="chipsConfirmBtn" onclick="confirmChips()" disabled>Confirm selection</button>
    <button class="chips-clear" onclick="clearChips()">Clear</button>
    <span class="chips-count" id="chipsCount"></span>
  </div>
</div>
<input type="file" id="fileInput" accept=".pdf,.doc,.docx" style="display:none;" onchange="handleFileSelected(this)"/>
<div class="input-bar">
  <button class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="Attach CV">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
    </svg>
  </button>
  <input type="text" id="userInput" placeholder="Type your answer..." onkeydown="if(event.key==='Enter')handleSend()"/>
  <button class="send-btn" id="sendBtn" onclick="handleSend()">
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>
</div></div>
<script>
var SHEETS_URL="https://script.google.com/macros/s/AKfycbwk4LYmpO-XyFmD-c81qc8ORo97QRmDjb1S_VwN6QsevRBIphkDVBk0Y_evxgBZqPe3/exec";
var REGIONS=["No preference","South Asia","Southeast Asia","East Asia","Sub-Saharan Africa","North Africa & Middle East","Western Europe","Eastern Europe & Balkans","Latin America & Caribbean","North America","Pacific Islands","Central Asia"];
var POLICY=["Climate & Environment","Energy & Clean Technology","Urban Planning & Housing","Education & Skills","Public Health","Gender Equality & Rights","Economic Justice & Labour","Digital Rights & AI Governance","Trade & Finance","Peace & Security","Migration & Refugees","Food & Agriculture","Culture & Creative Industries","Justice & Rule of Law","Youth Representation"];
var WORK_TYPES=["Legislative Research","Policy Drafting","Campaign Strategy","Social Media & Comms","Speech & Report Writing","Constituency Work","International Outreach","Parliamentary Monitoring","Data & Analytics","Event Organisation","Stakeholder Engagement","Media & Press Relations"];
var collected={},currentStep=0,multiSel=[],chipMax=null,awaitingChips=false,awaitingTerms=false,awaitingFile=false,isProcessing=false,resumeFile=null;
var STEPS=[
  {key:"intro",next:"terms"},
  {key:"terms",next:"full_name"},
  {key:"full_name",prompt:"Let's start with your full legal name.",ph:"e.g. Priya Sharma",next:"email",validate:function(v){return v.trim().length<2?"Please enter your full name.":null;}},
  {key:"email",prompt:"And what's the best email address to reach you on?",ph:"e.g. priya@example.com",next:"nationality",validate:function(v){return /\S+@\S+\.\S+/.test(v)?null:"That doesn't look like a valid email - can you double check it?";}},
  {key:"nationality",prompt:"What's your nationality?",ph:"e.g. Indian, Nigerian, Brazilian...",next:"current_situation",validate:function(v){return v.trim().length<2?"Please enter your nationality.":null;}},
  {key:"current_situation",fallbackPrompt:"Tell me a little about where you are right now - are you a student, working professional, recent graduate, or something else?",ph:"e.g. Final-year undergrad, early-career researcher...",next:"institution",isContextual:true},
  {key:"institution",fallbackPrompt:"Which university, organisation, or institution are you currently affiliated with?",ph:"e.g. LSE, University of Nairobi, World Bank...",next:"languages",isContextual:true},
  {key:"languages",fallbackPrompt:"Which languages do you speak? Please include your level for each one.",ph:"e.g. English (native), Hindi (fluent), French (B1)",next:"availability",isContextual:true},
  {key:"availability",fallbackPrompt:"When are you available to start, and for how long? Our placements run 4-6 months at around 5 hours per week - all fully remote.",ph:"e.g. Starting July 2026, available for 5 months",next:"region",isContextual:true},
  {key:"region",prompt:"Do you have a preference for which region your MP is based in? Select up to 4.",chips:REGIONS,max:4,next:"policy_areas"},
  {key:"policy_areas",prompt:"Which policy areas are you most passionate about? Select all that apply.",chips:POLICY,multi:true,next:"work_types"},
  {key:"work_types",prompt:"What kind of work would you like to do with the MP? Pick everything that interests you.",chips:WORK_TYPES,multi:true,next:"motivation"},
  {key:"motivation",fallbackPrompt:"Last one - in a few sentences, why do you want to be part of the CYP Staffing Programme for International Representatives?",ph:"Share your motivation...",next:"resume",isContextual:true},
  {key:"resume",next:"done"},
  {key:"done"}
];
var TOTAL_DATA_STEPS=STEPS.length-3;
function el(id){return document.getElementById(id);}
function buildPips(){var c=el("stepPips");c.innerHTML="";for(var i=0;i<TOTAL_DATA_STEPS;i++){var d=document.createElement("div");d.className="step-pip";d.id="pip"+i;c.appendChild(d);}}
function updateProgress(si){var di=si-2;var labels=["Programme terms","Personal details","Background","Preferences","Policy interests","Work style","Motivation","CV upload","Complete"];el("progressTxt").textContent=labels[Math.min(Math.max(di,0),labels.length-1)]||"Complete";for(var i=0;i<TOTAL_DATA_STEPS;i++){var p=el("pip"+i);if(!p)continue;p.className="step-pip"+(i<di?" done":i===di?" active":"");}}
function scrollBottom(){var ca=el("chatArea");setTimeout(function(){ca.scrollTop=ca.scrollHeight;},60);}
function botAvatar(){var av=document.createElement("div");av.className="avatar";av.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="white" stroke-width="2"/><path d="M4 20c0-4 3.6-8 8-8s8 4 8 8" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>';return av;}
function addBubble(html,who,cls){var ca=el("chatArea");var row=document.createElement("div");row.className="bubble-row "+who;if(who==="bot")row.appendChild(botAvatar());var bub=document.createElement("div");bub.className="bubble "+who+(cls?" "+cls:"");bub.innerHTML=html.replace(/\n/g,"<br>");row.appendChild(bub);ca.appendChild(row);scrollBottom();return bub;}
function addTyping(){var ca=el("chatArea");var row=document.createElement("div");row.className="bubble-row bot";row.id="typingRow";row.appendChild(botAvatar());var bub=document.createElement("div");bub.className="bubble bot typing-dots";bub.innerHTML="<span></span><span></span><span></span>";row.appendChild(bub);ca.appendChild(row);scrollBottom();}
function removeTyping(){var t=el("typingRow");if(t)t.remove();}
function addFileBubble(name,size){var ca=el("chatArea");var row=document.createElement("div");row.className="bubble-row user";var w=document.createElement("div");w.className="file-bubble";var kb=Math.round(size/1024);w.innerHTML='<div class="file-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1f5e" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div><div class="file-info"><div class="file-name">'+name+'</div><div class="file-size">'+kb+' KB</div></div><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#15803d" stroke-width="2.5" style="flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>';row.appendChild(w);ca.appendChild(row);scrollBottom();}
function addUploadCard(){var ca=el("chatArea");var row=document.createElement("div");row.className="bubble-row bot";row.id="uploadRow";row.appendChild(botAvatar());var card=document.createElement("div");card.className="upload-card";card.id="uploadCard";card.innerHTML='<div class="upload-header"><div class="terms-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div><div class="upload-header-title">Attach your CV / Resume</div></div><div class="upload-body"><div class="upload-desc">Please upload your CV so we can build a complete picture of your profile for matching.</div><div class="drop-zone" id="dropZone" onclick="document.getElementById(\'fileInput\').click()" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event)"><div><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2d3494" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div><div class="drop-text"><b>Click to upload</b> or drag and drop</div><div class="drop-types">PDF, DOC, or DOCX - Max 5 MB</div></div></div>';row.appendChild(card);ca.appendChild(row);scrollBottom();}
function handleDragOver(e){e.preventDefault();var dz=el("dropZone");if(dz)dz.classList.add("drag-over");}
function handleDragLeave(){var dz=el("dropZone");if(dz)dz.classList.remove("drag-over");}
function handleDrop(e){e.preventDefault();var dz=el("dropZone");if(dz)dz.classList.remove("drag-over");var f=e.dataTransfer.files[0];if(f)processFile(f);}
function handleFileSelected(input){var f=input.files[0];if(f)processFile(f);input.value="";}
function processFile(file){var ok=["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"];if(ok.indexOf(file.type)<0&&!file.name.match(/\.(pdf|doc|docx)$/i)){addBubble("Please upload a PDF, DOC, or DOCX file.","bot","error");return;}if(file.size>5*1024*1024){addBubble("That file is too large - please keep it under 5 MB.","bot","error");return;}resumeFile=file;collected["resume_filename"]=file.name;collected["resume_size"]=file.size;var ur=el("uploadRow");if(ur)ur.remove();addFileBubble(file.name,file.size);awaitingFile=false;setTimeout(function(){addTyping();delay(800).then(function(){removeTyping();addBubble("Perfect - CV attached!","bot");return delay(600);}).then(function(){currentStep=STEPS.findIndex(function(s){return s.key==="done";});updateProgress(currentStep);showCurrentStep();});},400);}
function addTermsCard(){var ca=el("chatArea");var row=document.createElement("div");row.className="bubble-row bot";row.appendChild(botAvatar());var card=document.createElement("div");card.className="terms-card";card.innerHTML='<div class="terms-header"><div class="terms-icon"><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="white" stroke-width="2"/></svg></div><div class="terms-header-title">Programme Terms - please read before applying</div></div><div class="terms-body"><div class="terms-item"><div class="terms-bullet remote"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><rect x="2" y="3" width="20" height="14" rx="2" stroke="#0369a1" stroke-width="2"/><path d="M8 21h8M12 17v4" stroke="#0369a1" stroke-width="2" stroke-linecap="round"/></svg></div><div class="terms-item-text"><b>Fully remote opportunity.</b> This placement is conducted entirely online - work from anywhere in the world alongside your assigned elected representative.</div></div><div class="terms-item"><div class="terms-bullet unpaid"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" stroke="#b45309" stroke-width="2.5" stroke-linecap="round"/></svg></div><div class="terms-item-text"><b>Unpaid position.</b> This is a voluntary internship. No financial compensation, stipend, or reimbursement is provided.</div></div><div class="terms-item"><div class="terms-bullet time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#9d174d" stroke-width="2"/><path d="M12 7v5l3 3" stroke="#9d174d" stroke-width="2" stroke-linecap="round"/></svg></div><div class="terms-item-text"><b>Time commitment.</b> 4-6 months at approximately 5 hours per week, agreed directly with your assigned representative.</div></div><div class="terms-item"><div class="terms-bullet connect"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="#2d3494" stroke-width="2"/><circle cx="9" cy="7" r="4" stroke="#2d3494" stroke-width="2"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke="#2d3494" stroke-width="2" stroke-linecap="round"/></svg></div><div class="terms-item-text"><b>CYP\'s role is connection only.</b> The Centre for Youth Policy acts solely as a matchmaking body. CYP bears no responsibility for the day-to-day working relationship, tasks assigned, or outcomes of the placement.</div></div><div class="terms-item"><div class="terms-bullet cert"><svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 15l-2 5 2-1 2 1-2-5" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="8" r="6" stroke="#15803d" stroke-width="2"/></svg></div><div class="terms-item-text"><b>Certificate &amp; completion letter.</b> Upon finishing your internship, you will receive an official CYP Certificate of Completion and a signed letter confirming your contribution.</div></div><div class="terms-disclaimer">By clicking "I agree &amp; continue", you acknowledge that you have read and understood these terms. This does not constitute a formal contract between you and CYP or the elected representative.</div><button class="terms-agree-btn" id="agreeBtn" onclick="agreeToTerms()">I agree &amp; continue &rarr;</button></div>';row.appendChild(card);ca.appendChild(row);scrollBottom();}
function agreeToTerms(){var btn=el("agreeBtn");btn.disabled=true;btn.textContent="Agreed";collected["terms_agreed"]="Yes";awaitingTerms=false;addBubble("I've read and agree to the programme terms.","user");currentStep=STEPS.findIndex(function(s){return s.key==="full_name";});updateProgress(currentStep);setTimeout(showCurrentStep,500);}
function showChips(options,multi,max,label,sublabel){awaitingChips=true;multiSel=[];chipMax=max||null;el("chipsLabel").textContent=label||(multi||max?"Select all that apply":"Choose one");var sl=el("chipsSublabel");if(sublabel){sl.textContent=sublabel;sl.style.display="block";}else{sl.style.display="none";}var container=el("chipsContainer");container.innerHTML="";options.forEach(function(opt){var c=document.createElement("div");c.className="chip";c.textContent=opt;c.onclick=function(){var isSel=multiSel.indexOf(opt)>-1;if(!multi&&!max){container.querySelectorAll(".chip").forEach(function(x){x.classList.remove("selected");});c.classList.add("selected");multiSel=[opt];setTimeout(confirmChips,280);}else{if(isSel){multiSel=multiSel.filter(function(x){return x!==opt;});c.classList.remove("selected");}else{if(chipMax&&multiSel.length>=chipMax)return;multiSel.push(opt);c.classList.add("selected");}updateChipCount();}};container.appendChild(c);});var isM=multi||(max&&max>1);el("chipsAction").style.display=isM?"flex":"none";el("chipsConfirmBtn").disabled=true;el("chipsCount").textContent="";el("chipsArea").style.display="block";el("userInput").disabled=true;el("sendBtn").disabled=true;}
function updateChipCount(){var btn=el("chipsConfirmBtn");var ce=el("chipsCount");btn.disabled=multiSel.length===0;if(chipMax){ce.textContent=multiSel.length+" / "+chipMax+" selected";}else{ce.textContent=multiSel.length>0?multiSel.length+" selected":"";}}
function hideChips(){el("chipsArea").style.display="none";el("chipsContainer").innerHTML="";multiSel=[];awaitingChips=false;chipMax=null;}
function confirmChips(){if(multiSel.length===0)return;hideChips();el("userInput").disabled=false;el("sendBtn").disabled=false;addBubble(multiSel.join(", "),"user");processAnswer(multiSel.join(", "));}
function clearChips(){multiSel=[];el("chipsContainer").querySelectorAll(".chip").forEach(function(c){c.classList.remove("selected");});updateChipCount();}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
function callClaude(system,userMsg){return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:300,system:system,messages:[{role:"user",content:userMsg}]})}).then(function(r){return r.json();}).then(function(d){return d.content&&d.content[0]?d.content[0].text:null;}).catch(function(){return null;});}
function getContextualQuestion(step){var ctx=JSON.stringify(collected);var prompts={current_situation:"You are a warm intake assistant for the Centre for Youth Policy's international MP staffing programme. Collected so far: "+ctx+". In 1-2 natural sentences, ask the applicant about their current situation. Be open and warm. Reply with the question only.",institution:"You are a warm intake assistant for CYP. The applicant said: \""+collected.current_situation+"\". Write ONE adaptive question asking about their university, employer, or equivalent. If they don't study or are self-employed, ask the relevant equivalent. Reply with the question only.",languages:"You are a warm intake assistant for CYP. Collected: "+ctx+". Ask about languages spoken in one sentence, include level. Reply with the question only.",availability:"You are a warm intake assistant for CYP. Collected: "+ctx+". Ask when they can start and how long. Mention 4-6 months at ~5 hrs/week, fully remote. One sentence. Reply with the question only.",motivation:"You are a warm intake assistant for CYP. Collected: "+ctx+". Ask for their motivation in a personalised way referencing something specific from their profile. 1-2 sentences. Reply with the question only."};return callClaude("You are a professional, warm intake chatbot. Reply with only the question, no preamble.",prompts[step.key]||step.fallbackPrompt).then(function(r){return r||step.fallbackPrompt;});}
function getAdaptiveAck(userInput,stepKey){var ctx=JSON.stringify(collected);var system="You are a warm intake assistant for CYP. The applicant just answered \""+stepKey+"\" with: \""+userInput+"\". Context: "+ctx+". Acknowledge warmly in 1 sentence. If unusual (doesn't study, between jobs, self-taught), acknowledge specifically. Do NOT ask a question. Max 2 sentences.";var fb={current_situation:"Thanks for sharing that!",institution:"Got it, noted!",languages:"Wonderful, that's really useful.",availability:"Perfect, we'll keep that in mind.",motivation:"That's a compelling reason - thank you for sharing."};return callClaude(system,userInput).then(function(r){return r||fb[stepKey]||"Got it, thank you!";});}
function submitToSheets(){el("submittingBar").style.display="flex";return fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},body:JSON.stringify(collected)}).then(function(){el("submittingBar").style.display="none";}).catch(function(){el("submittingBar").style.display="none";});}
function processAnswer(val){if(isProcessing)return;isProcessing=true;var step=STEPS[currentStep];collected[step.key]=val;var p;if(step.isContextual){addTyping();p=getAdaptiveAck(val,step.key).then(function(ack){removeTyping();addBubble(ack,"bot");return delay(500);});}else{p=Promise.resolve();}p.then(function(){currentStep=STEPS.findIndex(function(s){return s.key===step.next;});if(currentStep<0)currentStep=STEPS.length-1;updateProgress(currentStep);return showCurrentStep();}).then(function(){isProcessing=false;});}
function showCurrentStep(){var step=STEPS[currentStep];if(!step)return Promise.resolve();
if(step.key==="done"){return submitToSheets().then(function(){addTyping();return delay(900);}).then(function(){removeTyping();var hasResume=resumeFile!==null;addBubble("That's everything - and on behalf of everyone at the Centre for Youth Policy, thank you. We genuinely mean it.\n\nDedicating your time and energy to supporting young leaders around the world is no small thing. From Africa to Europe, we've been able to place volunteers with over 12 MPs - and it's people like you who make that possible.\n\nWe'll be in touch within 5 business days to discuss your match."+((!hasResume)?"\n\nPlease also send your CV to <b>placements@centreforyouthpolicy.org</b> with subject: <i>CYP Intern 2026 - [Your Name]</i>":""),"bot");el("completeCard").style.display="flex";el("userInput").disabled=true;el("sendBtn").disabled=true;el("attachBtn").disabled=true;});}
if(step.key==="intro"){addTyping();return delay(900).then(function(){removeTyping();addBubble("Welcome to the Centre for Youth Policy's Staffing Programme for International Representatives.","bot");return delay(700);}).then(function(){addTyping();return delay(1100);}).then(function(){removeTyping();addBubble("I'm part of the CYP team, and I'm here to help find you the right match. Our mission is to ensure young elected representatives around the world are equipped, supported, and ready to lead - and talented interns like you are at the heart of that.","bot");return delay(700);}).then(function(){addTyping();return delay(800);}).then(function(){removeTyping();addBubble("Before we get into the details, please take a moment to review the programme terms below.","bot");return delay(400);}).then(function(){currentStep=STEPS.findIndex(function(s){return s.key==="terms";});updateProgress(currentStep);return showCurrentStep();});}
if(step.key==="terms"){awaitingTerms=true;el("userInput").disabled=true;el("sendBtn").disabled=true;addTermsCard();return Promise.resolve();}
if(step.key==="resume"){awaitingFile=true;el("userInput").disabled=true;el("sendBtn").disabled=true;addTyping();return delay(600).then(function(){removeTyping();addUploadCard();});}
addTyping();var promptP;if(step.isContextual){promptP=getContextualQuestion(step);}else{promptP=Promise.resolve(step.prompt);}return promptP.then(function(prompt){return delay(Math.random()*200+500).then(function(){return prompt;});}).then(function(prompt){removeTyping();if(prompt)addBubble(prompt,"bot");if(step.chips){return delay(300).then(function(){var isM=step.multi||false;var max=step.max||null;var sub=max?"Choose up to "+max:null;showChips(step.chips,isM,max,step.prompt,sub);});}else{el("userInput").placeholder=step.ph||"Type your answer...";el("userInput").disabled=false;el("sendBtn").disabled=false;el("userInput").focus();return Promise.resolve();}});}
function handleSend(){if(isProcessing||awaitingChips||awaitingTerms||awaitingFile)return;var inp=el("userInput");var val=inp.value.trim();if(!val)return;var step=STEPS[currentStep];if(step.validate){var err=step.validate(val);if(err){addBubble(err,"bot","error");return;}}inp.value="";el("userInput").disabled=true;el("sendBtn").disabled=true;addBubble(val,"user");processAnswer(val);}
buildPips();showCurrentStep();
</script>
